<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swole Hub">
<meta name="theme-color" content="#0b1220">
<title>Swole Hub</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.jpg">
<link rel="icon" type="image/jpeg" href="/icon.jpg">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#0b1220;--card:#141d33;--card2:#1c2946;--ink:#eef2ff;--mut:#93a1c0;--line:#26324c;
    --accent:#3b82f6;--accent2:#10b981;--warn:#fb7185;--gold:#f5b301;--pr:#f43f5e;--chip:#22304d;
    --safe-top:env(safe-area-inset-top);--safe-bot:env(safe-area-inset-bottom);--navh:62px;--navgap:max(10px, calc(var(--safe-bot) - 12px))}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html{height:100%;height:-webkit-fill-available}
  body{margin:0;background:var(--bg);color:var(--ink);height:100%;height:-webkit-fill-available;height:100dvh;
    display:flex;flex-direction:column;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
  button,input,select{font-family:inherit}
  header{flex:0 0 auto;z-index:20;background:rgba(11,18,32,.94);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);padding:calc(10.5px + var(--safe-top)) 0 0}
  .htop{display:flex;align-items:flex-start;justify-content:space-between;padding:0 14px;gap:9px}
  .h-title{font-size:16.5px;font-weight:800;letter-spacing:.3px}
  .h-sub{font-size:9.5px;color:var(--mut);text-align:right;margin-top:4.5px}
  .userchip{font-size:10.5px;font-weight:800;color:#dbe4ff;background:var(--card);border:1px solid var(--line);border-radius:879px;padding:4.5px 9.5px;cursor:pointer;display:inline-block}
  .userchip:active{border-color:var(--accent)}
  .tickerwrap{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);margin-top:7px;padding:3.5px 0}
  .ticker{display:inline-block;white-space:nowrap;animation:scrollx 20s linear infinite;font-size:10px;font-weight:800;font-style:italic;color:var(--gold);will-change:transform}
  @keyframes scrollx{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .slab{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3.5px}
  .weeknav{display:flex;align-items:center;justify-content:center;gap:12.5px;padding:8px 14px 2px}
  .weeknav button{width:30px;height:26.5px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
  .weeknav button:disabled{opacity:.32} .weeknav button:active{background:var(--accent);border-color:var(--accent)}
  .wlabel{font-size:11px;font-weight:700;color:#c7d2fe;min-width:112.5px;text-align:center}
  .days{display:flex;gap:5px;overflow-x:auto;padding:9px 12px 10.5px;max-width:640px;margin:0 auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .days::-webkit-scrollbar{display:none}
  .day{flex:1 1 0;min-width:40px;text-align:center;padding:6px 0;border-radius:12.5px;background:var(--card);border:1px solid var(--line);color:var(--mut);cursor:pointer;transition:.12s}
  .ringwrap{width:35px;height:35px;border-radius:50%;padding:2.5px;margin:0 auto}
  .ringinner{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center}
  .day.sel .ringinner{background:var(--accent)}
  .day .dabbr{font-weight:800;font-size:15px;line-height:1}
  .day .date{font-size:9.5px;color:var(--mut);margin-top:3.5px}
  .day.today{border-color:var(--accent2)} .day.today .date{color:var(--accent2)}
  .day.sel{background:var(--accent);border-color:var(--accent)} .day.sel .date{color:#fff} .day.sel .dabbr{color:#fff}
  .day.future{opacity:.5}
  .wrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
    width:100%;max-width:640px;margin:0 auto;padding:12.5px 12.5px calc(var(--navh) + var(--navgap) + 24px)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .kpi{background:radial-gradient(120% 120% at 50% 0%,#1b2947 0%,#111a30 100%);border:1px solid var(--line);border-radius:14px;padding:12.5px 7px 11.5px;text-align:center;position:relative;overflow:hidden}
  .kpi::before{content:'';position:absolute;top:0;left:22%;right:22%;height:2.5px;border-radius:0 0 3.5px 3.5px;background:var(--accent)}
  .kpi.k-gold::before{background:var(--gold)} .kpi.k-gold{border-color:#3a3413}
  .kpi.k-green::before{background:var(--accent2)} .kpi.k-green{border-color:#12352a}
  .kpi.k-blue::before{background:var(--accent)} .kpi.k-blue{border-color:#1c3157}
  .kpi .l{font-size:8px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .kpi .v{font-size:19.5px;font-weight:800;margin-top:4.5px;letter-spacing:.2px} .kpi .v small{font-size:9.5px;color:var(--mut);font-weight:600}
  .sect{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin:3.5px 2px 9px}
  .daytitle{font-size:14px;font-weight:800;color:#eef2ff;margin:3.5px 2px 10px;text-align:center}
  .daytitle .meta{display:block;margin-top:3px;font-size:10px;color:var(--mut);font-weight:600}
  .exsec{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
  .exsec.first{margin-top:2px}
  .exh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:.2px;color:#eef2ff;cursor:pointer}
  .exh .caret{color:var(--mut);font-size:9.5px;font-weight:700}
  /* collapsible sections: the whole row is the toggle */
  .exsec.tap{cursor:pointer;margin:9px 0 0;padding:12px 13px;background:var(--card);border:1px solid var(--line);border-radius:14px;transition:background .15s,border-color .15s}
  .exsec.tap:active{transform:scale(.99);background:var(--card2)}
  .exsec.tap.open{margin-bottom:8px;border-color:#2f3d5c}
  .exsec.tap.first{margin-top:2px}
  .exsec .right{display:flex;align-items:center;gap:9px}
  .chev{display:inline-block;color:var(--mut);font-size:17px;font-weight:700;line-height:1;transition:transform .25s cubic-bezier(.34,1.4,.64,1)}
  .open>.right>.chev,.card.open .chev{transform:rotate(90deg)}
  .exsec .sub{font-size:11px;color:var(--mut);font-weight:600}
  .catpill{font-size:8px;font-weight:800;padding:2.5px 8px;border-radius:879px;border:1px solid;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .miniskip{font-size:9px;font-weight:700;padding:4.5px 9.5px;border-radius:879px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer}
  .miniskip.on{background:var(--pr);border-color:var(--pr);color:#fff}
  .habits{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .habit{background:var(--card);border:1px solid var(--line);border-radius:12.5px;padding:9.5px 9px;cursor:pointer;min-width:0;display:flex;flex-direction:column}
  .habit.wide{grid-column:1/-1}
  .habit .n{overflow:hidden}
  .exstep{margin-top:auto;padding-top:8px}
  .exval{text-align:center;font-weight:800;font-size:13px;color:var(--ink)}
  .exval .u{font-size:9.5px;color:var(--mut);font-weight:600}
  .exbtns{display:flex;gap:5.5px;margin-top:5.5px}
  .exbtns button{flex:1;height:28px;border-radius:8px;border:1px solid var(--line);background:#0f1830;color:var(--ink);
    font-size:16.5px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;-webkit-appearance:none;appearance:none}
  .exbtns button:active{background:var(--accent);border-color:var(--accent);transform:scale(.96)}
  .habit:active{transform:scale(.99)}
  .habit.hdone{border-color:var(--accent2);background:linear-gradient(180deg,#122a20,#141d33)}
  .habit.skipped{opacity:.5}
  .habit .n{font-weight:700;font-size:12px;display:flex;align-items:center;gap:4.5px}
  .habit .chk{color:var(--accent2);font-weight:900;display:none} .habit.hdone .chk{display:inline}
  .habit .p{font-size:9.5px;color:var(--mut);margin-top:2.5px}
  .bar{height:4.5px;background:#0f1830;border-radius:3.5px;margin-top:7px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent2);transition:width .3s}
  .habit .srow{display:flex;align-items:center;justify-content:center;gap:5.5px;margin-top:8px;font-size:9.5px;color:var(--mut)}
  .habit .srow button{width:23px;height:23px;border-radius:7px;border:1px solid var(--line);background:#0f1830;color:var(--ink);font-size:14px;font-weight:700;line-height:1;cursor:pointer}
  .habit .srow span{color:var(--ink);font-weight:800;font-size:12.5px;min-width:31.5px;text-align:center}
  .swrow{display:grid;grid-template-columns:repeat(4,1fr);gap:5.5px;margin-top:9px}
  .swc{background:#0f1830;border:1px solid var(--line);border-radius:9px;padding:5.5px 2px;text-align:center}
  .swc .swl{font-size:9px;color:var(--mut)} .swc .swv{font-size:16px;font-weight:800;margin:2px 0}
  .swc .swb{display:flex;gap:3.5px} .swc .swb button{flex:1;height:23px;border-radius:6px;border:1px solid var(--line);background:#131c30;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12.5px;margin-bottom:10.5px;transition:border-color .15s,background .15s}
  .card.done{border-color:var(--accent2);background:linear-gradient(180deg,#123024,#141d33)}
  .card.record{border-color:var(--gold);background:linear-gradient(180deg,#2a2410,#141d33)}
  .card.flat{border-color:#f59e0b;background:linear-gradient(180deg,#2c1f0c,#141d33)}
  .card.invalid{border-color:var(--pr)} .card.skipped{opacity:.55}
  .card.skipped .steppers,.card.skipped .chips,.card.skipped .note{filter:grayscale(.85);pointer-events:none;opacity:.65}
  .crow{display:flex;align-items:center;justify-content:space-between;gap:9px}
  .ex{font-size:14px;font-weight:700;line-height:1.2}
  .badges{display:flex;gap:5.5px;align-items:center;flex:0 0 auto}
  .tag{font-size:8.5px;color:var(--mut);border:1px solid var(--line);border-radius:879px;padding:2.5px 8px;text-transform:uppercase;letter-spacing:.4px}
  .tag.skip{color:#cbd5e1}
  .preset{margin-top:7px;padding:7px 9.5px;border-radius:9.5px;background:#0f1830;border:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:#a5c6ff;letter-spacing:.2px;white-space:pre-wrap;word-break:break-word}
  .last{font-size:10.5px;color:var(--mut);margin-top:6px} .last b{color:#c7d2fe}
  .editing{font-size:10px;color:var(--accent2);margin-top:5.5px;font-weight:600}
  .warn{font-size:10px;color:var(--warn);margin-top:8px;font-weight:600;display:none} .warn.on{display:block}
  .steppers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11.5px}
  .steppers.c1{grid-template-columns:1fr} .steppers.c2{grid-template-columns:1fr 1fr}
  .st{background:var(--card2);border:1px solid var(--line);border-radius:12.5px;padding:9px 7px;text-align:center}
  .st .lab{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
  .st .val{width:100%;min-width:0;background:transparent;border:none;color:var(--ink);font-size:24px;font-weight:800;text-align:center;padding:2.5px 0 1px;-moz-appearance:textfield;line-height:1.1}
  .st .val:focus{outline:none}
  .st .val::-webkit-outer-spin-button,.st .val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .st .unit{font-size:9px;color:var(--mut);height:10.5px}
  .st .ctrl{display:flex;gap:5.5px;margin-top:6px}
  .st .ctrl button{flex:1;height:31.5px;border-radius:9px;border:1px solid var(--line);background:#0f1830;color:var(--ink);font-size:18.5px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .st .ctrl button:active{background:var(--accent);border-color:var(--accent);transform:scale(.96)}
  .chips{display:flex;flex-wrap:wrap;gap:5.5px;margin-top:10.5px}
  .chip{font-size:11px;padding:7px 10.5px;border-radius:879px;background:var(--chip);border:1px solid var(--line);color:#cbd5e1;cursor:pointer;user-select:none;touch-action:manipulation}
  .chip:active{transform:scale(.96)} .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.pr.sel{background:var(--gold);border-color:var(--gold);color:#1b1400}
  .stars{margin-top:9px;font-size:24.5px;letter-spacing:5.5px;cursor:pointer;user-select:none}
  .star{color:#31405f} .star.on{color:var(--gold)}
  .note{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:9px 10.5px;border-radius:10.5px;font-size:14px;margin-top:9.5px}
  .note:focus{outline:none;border-color:var(--accent)}
  .timein{margin-top:0;width:100%;min-width:0;max-width:100%;padding:9px 7px;-webkit-appearance:none;appearance:none}
  .sesshint{font-size:10.5px;color:var(--mut);margin-top:8px;font-weight:600;min-height:14px}
  .sesshint b{color:#c7d2fe}
  /* collapsible workout cards */
  .cardhead{cursor:pointer}
  .cardhead{margin:-12.5px;padding:12.5px}
  .card.open .cardhead{padding-bottom:0;margin-bottom:0}
  /* pyramid sets */
  .pyrwrap{margin-top:10.5px;display:flex;flex-direction:column;gap:6px}
  .pyrrow{display:flex;align-items:center;gap:5.5px}
  .pyrsn{font-size:8.5px;font-weight:800;color:var(--mut);width:31.5px;flex:0 0 auto;letter-spacing:.3px}
  .pyrbar{flex:1;min-width:0;height:30px;border-radius:8px;background:#0f1830;border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 3.5px}
  .pyrbar>i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#274a86,#3b82f6);opacity:.5;z-index:0}
  .pyrbar .pb{position:relative;z-index:1;width:25.5px;height:23px;border-radius:6px;border:1px solid var(--line);background:#131c30;color:var(--ink);font-size:15px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .pbv{position:relative;z-index:1;font-size:13px;font-weight:800;color:#eaf1ff}
  .pbv small{font-size:9px;color:#b9c8e6;font-weight:600}
  .pyrreps{flex:0 0 auto;display:flex;align-items:center;gap:2.5px;background:#0f1830;border:1px solid var(--line);border-radius:8px;padding:0 2.5px;height:30px}
  .pyrreps .pb{width:23px;height:23px;border-radius:6px;border:1px solid var(--line);background:#131c30;color:var(--ink);font-size:14px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
  .pyrreps span{font-size:12.5px;font-weight:800;min-width:26.5px;text-align:center}
  .pyrreps span small{font-size:8px;color:var(--mut);font-weight:600}
  .pyrx{flex:0 0 auto;width:19.5px;height:21px;border-radius:6px;border:none;background:transparent;color:var(--warn);font-size:16px;font-weight:700;line-height:1;cursor:pointer;padding:0}
  .addset{margin-top:2px;width:100%;height:30px;border-radius:9px;border:1px dashed #33456b;background:transparent;color:#9fb3d6;font-size:11px;font-weight:800;cursor:pointer}
  .pyrsum{font-size:10.5px;color:var(--mut);margin-top:9.5px;line-height:1.55}
  .pyrsum b{color:#c7d2fe}
  .pyrpr{color:#8ee6bf;font-weight:700;font-size:9.5px}
  .actions{display:flex;gap:7px;margin-top:10.5px}
  .btn{flex:1;padding:12.5px;border-radius:12.5px;border:none;font-size:13px;font-weight:800;cursor:pointer;touch-action:manipulation}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{flex:0 0 auto;background:var(--card2);color:var(--ink);border:1px solid var(--line);padding:12.5px 14px}
  .btn:active{transform:scale(.99);filter:brightness(1.08)} .btn.saving{opacity:.6;pointer-events:none} .btn:disabled{opacity:.4;pointer-events:none}

  /* ---- Liquid Glass tab bar: floating capsule, draggable lens ---- */
  nav{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--navgap);z-index:30;
    width:min(calc(100% - 32px), 420px);height:var(--navh);display:flex;align-items:stretch;padding:5px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
    -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
    touch-action:none;user-select:none;-webkit-user-select:none}
  nav a{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:#c3cde4;font-size:10.5px;font-weight:700;letter-spacing:.2px;cursor:pointer;border-radius:999px;transition:color .25s}
  nav a .ic{font-size:19px;line-height:1;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  nav a.active{color:#fff} nav a.active .ic{transform:scale(1.08)}
  .navlens{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:0;border-radius:999px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.08));
    border:1px solid rgba(255,255,255,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -6px 14px rgba(59,130,246,.18),0 4px 14px rgba(0,0,0,.25);
    transition:transform .45s cubic-bezier(.34,1.4,.64,1),width .45s cubic-bezier(.34,1.4,.64,1),height .2s,top .2s,bottom .2s}
  .navlens.drag{transition:none;top:1px;bottom:1px;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12))}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ nav{background:rgba(20,29,51,.96)} }
  .view{display:none}.view.active{display:block}
  .muted{color:var(--mut);font-size:11.5px}
  canvas{background:var(--card);border:1px solid var(--line);border-radius:12.5px;padding:9px;margin-top:9px}
  .center{text-align:center;padding:35px 9px;color:var(--mut)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:calc(var(--navh) + var(--navgap) + 14px);transform:translateX(-50%) translateY(16px);background:#0f1830;border:1px solid var(--accent);color:#fff;padding:9.5px 14px;border-radius:10.5px;font-size:12.5px;font-weight:700;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:88%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)} #toast.gold{border-color:var(--gold)} #toast.err{border-color:var(--pr)} #toast.warn{border-color:#f59e0b}
  .picker{position:fixed;inset:0;z-index:100;background:rgba(6,10,20,.92);backdrop-filter:blur(5.5px);display:none;align-items:center;justify-content:center;padding:21px}
  .picker.show{display:flex}
  .picker-box{width:100%;max-width:317px;text-align:center}
  .picker-title{font-size:19.5px;font-weight:800} .picker-sub{color:var(--mut);margin:5.5px 0 19.5px;font-size:12.5px}
  .picker-btns{display:flex;flex-direction:column;gap:10.5px}
  .pbtn{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer}
  .pbtn:active{transform:scale(.99)} .pbtn.cur{border-color:var(--accent);background:linear-gradient(180deg,#16233f,#141d33)}

<script>
/* google.script.run shim: same call style as Apps Script, backed by POST /api/<fn>. */
(function(){
  function tok(){ try{ return localStorage.getItem('thq_tok')||''; }catch(e){ return ''; } }
  function runner(){
    let ok=function(){}, fail=function(e){ console.error(e); };
    const p=new Proxy({}, { get(_, name){
      if(name==='withSuccessHandler') return function(f){ ok=f; return p; };
      if(name==='withFailureHandler') return function(f){ fail=f; return p; };
      return function(){ const args=Array.prototype.slice.call(arguments);
        fetch('/api/'+name, { method:'POST', headers:{'content-type':'application/json','x-swole-token':tok()}, body:JSON.stringify(args) })
          .then(async function(r){ const j=await r.json().catch(function(){ return {error:'Bad response ('+r.status+')'}; });
            if(r.status===401){ if(window.onAuthExpired) window.onAuthExpired(); throw new Error('Please sign in again'); }
            if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
            return j.result; })
          .then(function(res){ ok(res); }, function(e){ fail(e); }); };
    }});
    return p;
  }
  window.google={ script:{ get run(){ return runner(); } } };
})();
</script>
<script>
const DAY_I18N={Monday:{ch:'月',jp:'月曜日',kr:'월요일'},Tuesday:{ch:'火',jp:'火曜日',kr:'화요일'},
 Wednesday:{ch:'水',jp:'水曜日',kr:'수요일'},Thursday:{ch:'木',jp:'木曜日',kr:'목요일'},
 Friday:{ch:'金',jp:'金曜日',kr:'금요일'},Saturday:{ch:'土',jp:'土曜日',kr:'토요일'},Sunday:{ch:'日',jp:'日曜日',kr:'일요일'}};
const SECTIONS=[
 {title:'Warmups',emoji:'🤸',cols:2,collapsible:true,defaultOpen:true,items:[

 {title:'Other Cardio',emoji:'🏊',cols:2,collapsible:true,defaultOpen:true,items:[

 {title:'Chillax Time',emoji:'🧖',cols:3,collapsible:true,defaultOpen:true,items:[

   {name:'Steam Room',kind:'timed',def:15,step:5},
   {name:'Cold Plunge',kind:'timed',def:3,step:1} ]}
];
const EXTRA_ITEMS=[]; SECTIONS.forEach((sec,si)=>sec.items.forEach(it=>{ it._i=EXTRA_ITEMS.length; EXTRA_ITEMS.push(it); }));
const SWIM_STROKES=['Free','Back','Breast','Fly'];
const CAT_COLOR={'Chest/Arms - Push':'#3b82f6','Chest/Arms - Pull':'#22c55e','Legs - Push':'#a855f7','Legs - Pull':'#f59e0b','Cardio':'#f43f5e','Core':'#eab308'};
function catPill(cat){ const c=CAT_COLOR[cat]||'#64748b'; return '<span class="catpill" style="color:'+c+';border-color:'+c+';background:'+c+'22">'+cat+'</span>'; }
const ARTS_META={'Piano':'🎹','Saxophone':'🎷','Chinese (Rednote)':'🇨🇳','Japanese (news/video)':'🇯🇵','Korean (news/shows)':'🇰🇷'};
const ARTS_LIST=Object.keys(ARTS_META);
let STATE=null,WEEK=null,WEEK_MODE='workout',CUR_OFFSET=0,CUR_DAY=null,CUR_DATE=null,TODAY_NAME=null,LOAD_SEL={};
let EXTRAS_DONE=[],EXTRAS_VAL={},ABS_SKIP=false,OPEN={},CUR_USER=null,USERS_LIST=[];
let TAB='workout',PROG_MODE='workout',SWIM={Free:0,Back:0,Breast:0,Fly:0},SWIM_MIN=30;
let cDV=null,cW=null,cV=null,PENDING_USER=null,tT;
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
function extraEmoji(n){ const m={'Stretching':'🤸','Bar Hang':'🎯','Core Leg Lifts':'🦵','Weighted Plank':'🧱','Weighted In & Outs':'🔄','Weighted Toe Touches':'👣','Russian Twists':'🌀','Weighted Crunches':'🔥','Flutter Kicks':'🦶','Weighted Side Plank':'🧱','Weighted Back Plank':'🧱','Plank Till Failure':'💀','Swimming':'🏊','Boxing':'🥊','Cycling':'🚴','Sauna':'🧖','Steam Room':'♨️','Cold Plunge':'🧊'}; return m[n]||'•'; }

/* ---------- boot ---------- */
initOpen();
(function(){ const saved=lsGet('thq_user');
  if(saved && lsGet('thq_tok')){ document.getElementById('userName').textContent=saved; startAs(saved); }   // returning user → 1 round-trip, no getUsers
  else { google.script.run.withSuccessHandler(function(u){ USERS_LIST=u&&u.length?u:['Arik']; showPicker(); }).withFailureHandler(bootErr).getUsers(); }
})();
function initOpen(){ SECTIONS.forEach(sec=>{ if(sec.collapsible){ const v=lsGet('thq_sec_'+sec.title); OPEN[sec.title]= (v==='1'); } }); }
function showPicker(){ if(!USERS_LIST.length){ google.script.run.withSuccessHandler(function(u){ USERS_LIST=u&&u.length?u:['Arik']; showPicker(); }).getUsers(); return; }
  const box=document.getElementById('pickerBtns'); box.innerHTML='';
  document.getElementById('pickerSub').textContent="Who's logging?"; document.getElementById('pinPad').style.display='none'; box.style.display='flex';
  USERS_LIST.forEach(u=>{ const b=document.createElement('button'); b.className='pbtn'+(u===CUR_USER?' cur':''); b.textContent=u; b.onclick=function(){ askPin(u); }; box.appendChild(b); });
  document.getElementById('picker').classList.add('show'); }
function askPin(u){ PENDING_USER=u; document.getElementById('pickerBtns').style.display='none';
  document.getElementById('pickerSub').textContent='Enter PIN for '+u; document.getElementById('pinMsg').textContent='';
  const inp=document.getElementById('pinInput'); inp.value=''; document.getElementById('pinPad').style.display='block'; setTimeout(()=>inp.focus(),50); }
function pinBack(){ showPicker(); }
function verifyPin(){ const pin=document.getElementById('pinInput').value;
  google.script.run.withSuccessHandler(function(ok){ if(ok){ lsSet('thq_tok',ok); startAs(PENDING_USER); }
    else { const pad=document.getElementById('pinPad'); document.getElementById('pinMsg').textContent='Wrong PIN, try again'; document.getElementById('pinInput').value=''; pad.classList.add('shake'); setTimeout(()=>pad.classList.remove('shake'),350); setTimeout(()=>document.getElementById('pinInput').focus(),60); }
  }).withFailureHandler(function(){ document.getElementById('pinMsg').textContent='Error — try again'; }).checkPin(PENDING_USER,pin); }
document.addEventListener('input',function(e){ if(e.target && e.target.id==='pinInput' && e.target.value.length===4) verifyPin(); });
function startAs(u){ CUR_USER=u; lsSet('thq_user',u); CUR_OFFSET=0; TAB='workout';
  document.getElementById('userName').textContent=u; document.getElementById('picker').classList.remove('show');
  document.getElementById('cards').innerHTML='<div class="center"><span class="spinner"></span> Loading '+u+'…</div>';
  const ck='thq_boot_'+u; let cached=null; try{ cached=JSON.parse(lsGet(ck)||'null'); }catch(e){}
  if(cached && cached.state && cached.state.today && cached.state.today.dateISO===localISO()){ applyBoot(cached,true); } else cached=null;
  google.script.run.withSuccessHandler(function(boot){ const fresh=JSON.stringify(boot); lsSet(ck,fresh);
      if(CUR_USER!==u) return;
      if(cached && fresh===JSON.stringify(cached)) return;   // nothing changed since last open
      applyBoot(boot,!cached); })
    .withFailureHandler(function(e){ if(!cached) bootErr(e); else toast('Offline? Showing last saved view','err'); }).getBoot(CUR_USER); }
function applyBoot(boot,showWelcome){ const st=Object.assign({},boot.state); if(!showWelcome) st.welcome=''; init(st); WEEK=boot.week; WEEK_MODE='workout'; renderWeek(); }
function localISO(){ const d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
window.onAuthExpired=function(){ try{ localStorage.removeItem('thq_tok'); localStorage.removeItem('thq_user'); }catch(e){} USERS_LIST=[]; showPicker(); };
function bootErr(e){ document.getElementById('cards').innerHTML='<div class="center">Couldn\'t load: '+(e&&e.message?e.message:e)+'</div>'; }

function init(s){ STATE=s; TODAY_NAME=s.today.day; CUR_DAY=s.today.day; CUR_DATE=s.today.dateISO; CUR_OFFSET=0;
  initExtras(s.today.extras); ABS_SKIP=!!s.today.absSkipped;
  applyArtsAccess(s.canArts);
  renderKpis(s.dashboard); renderExtras(); renderDay(s.today);
  document.getElementById('subhead').textContent=s.today.dateLabel;
  startTicker();
  maybeWelcome(s.welcome);
}
function applyArtsAccess(canArts){ const nav=document.getElementById('nav-arts'); if(nav) nav.style.display=canArts?'':'none';
  const pma=document.getElementById('pma'); if(pma) pma.style.display=canArts?'':'none';
  if(!canArts){ if(TAB==='arts') show('workout'); if(PROG_MODE==='arts') PROG_MODE='workout'; } requestAnimationFrame(moveNavLens); }
function maybeWelcome(msg){ if(!msg) return; document.getElementById('welcomeMsg').textContent=msg; document.getElementById('welcome').classList.add('show'); }
function closeWelcome(){ document.getElementById('welcome').classList.remove('show'); }
function startTicker(){ const seg='🏋️ Swole Hub 💪  ·  🔥 lift heavy, run far 🏃  ·  💦 no days off 😤  ·  ';
  document.getElementById('ticker').textContent = seg + seg; }

/* ---------- week + day (tab-aware) ---------- */
function stepWeek(delta){ const next=CUR_OFFSET+delta; if(next>0) return; CUR_OFFSET=next; reloadWeek(WEEK_MODE); }
function reloadWeek(mode){ WEEK_MODE=mode; google.script.run.withSuccessHandler(function(w){ WEEK=w; renderWeek(); loadDayForTab(); }).getWeek(CUR_USER,CUR_OFFSET,mode); }
function renderWeek(){ document.getElementById('wLabel').textContent=WEEK.weekLabel; document.getElementById('wNext').disabled=(CUR_OFFSET>=0);
  const el=document.getElementById('days'); el.innerHTML='';
  WEEK.days.forEach(d=>{ const p=document.createElement('div');
    p.className='day'+(d.isToday?' today':'')+(d.name===CUR_DAY?' sel':'')+(d.isFuture?' future':'');
    const pct=d.pct||0;
    p.innerHTML='<div class="ringwrap" style="background:conic-gradient(var(--accent2) '+pct+'%,#2b3752 '+pct+'% 100%)"><div class="ringinner"><span class="dabbr">'+DAY_I18N[d.name].ch+'</span></div></div><div class="date">'+d.label+'</div>';
    p.onclick=()=>selectDay(d.name); el.appendChild(p); });
  const sel=el.querySelector('.day.sel'); if(sel) sel.scrollIntoView({inline:'center',block:'nearest'}); }
function selectDay(name){ const d=WEEK.days.find(x=>x.name===name)||WEEK.days[0]; CUR_DAY=d.name; CUR_DATE=d.iso;
  document.querySelectorAll('#days .day').forEach((x,idx)=>x.classList.toggle('sel',WEEK.days[idx].name===CUR_DAY)); loadDayForTab(); }
function loadDayForTab(){ if(TAB==='arts'){ document.getElementById('artsCards').innerHTML='<div class="center"><span class="spinner"></span> Loading…</div>'; google.script.run.withSuccessHandler(renderArts).getArtsDay(CUR_USER,CUR_DATE); }
  else { document.getElementById('cards').innerHTML='<div class="center"><span class="spinner"></span> Loading…</div>'; google.script.run.withSuccessHandler(renderDay).withFailureHandler(bootErr).getDay(CUR_USER,CUR_DAY,CUR_DATE); } }

/* ---------- KPIs ---------- */
function renderKpis(d){ document.getElementById('kpis').innerHTML=kpi('Bench PR',d.benchPR+'<small> lb</small>','k-gold')+kpi('Full days',(d.completeDays||0)+'<small> this wk</small>','k-green')+kpi('Time this wk',fmtMin(d.weekMinutes||0),'k-blue'); }
function fmtMin(m){ m=Math.round(m||0); const h=Math.floor(m/60), mm=m%60; return (h?(h+'h'+(mm?' '+mm+'m':'')):(mm+'m'))||'0m'; }
function diffMin(a,b){ if(!a||!b) return 0; const x=a.split(':').map(Number), y=b.split(':').map(Number); let d=(y[0]*60+y[1])-(x[0]*60+x[1]); if(d<0) d+=1440; return d; }
function kpi(l,v,cls){ return '<div class="kpi '+(cls||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>'; }
function dashCount(name){ return (STATE&&STATE.dashboard&&STATE.dashboard.extraCounts&&STATE.dashboard.extraCounts[name])||0; }

/* ---------- Other Exercises (sectioned) ---------- */
function parseSwim(info){ SWIM={Free:0,Back:0,Breast:0,Fly:0}; SWIM_MIN=(info&&Number(info.time)>0)?Number(info.time):30;
  if(info&&info.notes){ String(info.notes).split('|').forEach(p=>{ const kv=p.split(':'); if(kv.length===2 && SWIM[kv[0]]!==undefined) SWIM[kv[0]]=Number(kv[1])||0; }); } }
function swTotal(){ return SWIM_STROKES.reduce((a,s)=>a+(SWIM[s]||0),0); }
function swStr(){ return SWIM_STROKES.map(s=>s+':'+(SWIM[s]||0)).join('|'); }
function initExtras(extras){ extras=extras||{}; EXTRAS_DONE=[];
  EXTRA_ITEMS.forEach(it=>{ const e=extras[it.name]; if(e) EXTRAS_DONE.push(it.name);
    if(it.kind==='reps') EXTRAS_VAL[it.name]=(e&&e.reps!==''&&e.reps!=null)?Number(e.reps):(it.def||0);
    else if(it.kind==='timed'||it.kind==='secs') EXTRAS_VAL[it.name]=(e&&e.time!==''&&e.time!=null)?Number(e.time):(it.def||0); });
  parseSwim(extras['Swimming']); }
function renderExtras(){ const box=document.getElementById('extras'); box.innerHTML='';
  SECTIONS.forEach((sec,si)=>{
    const open = sec.collapsible ? OPEN[sec.title] : true;
    const head=document.createElement('div'); head.className='exsec'+(si===0?' first':'')+(sec.collapsible?' tap'+(open?' open':''):'');
    if(sec.collapsible){ const doneN=sec.items.filter(it=>EXTRAS_DONE.indexOf(it.name)>=0).length;
      head.onclick=function(){ toggleSection(sec.title); };
      head.innerHTML='<div class="exh"><span>'+sec.emoji+' '+sec.title+'</span>'+(doneN?'<span class="sub">'+doneN+' done</span>':'')+'</div><div class="right">'+(sec.batchSkip?'<button class="miniskip'+(ABS_SKIP?' on':'')+'" onclick="toggleAbsSkip(event)">'+(ABS_SKIP?'Unskip all':'Skip all')+'</button>':'')+'<span class="chev">›</span></div>'; }
    else head.innerHTML='<div class="exh"><span>'+sec.emoji+' '+sec.title+'</span></div>';
    box.appendChild(head);
    const g=document.createElement('div'); g.className='habits'; g.style.gridTemplateColumns='repeat('+(sec.cols||2)+',1fr)';
    if(!open) g.style.display='none';
    sec.items.forEach(it=> g.appendChild(extraTile(it,sec)) );
    box.appendChild(g);
  });
}
function extraTile(it,sec){ if(it.kind==='swim') return swimTile(it);
  const i=it._i, done=EXTRAS_DONE.indexOf(it.name)>=0, disabled=sec.batchSkip&&ABS_SKIP;
  const div=document.createElement('div'); div.className='habit'+(done?' hdone':'')+(disabled?' skipped':'');
  let ctrl='';
  if(it.kind!=='toggle'){ const disp=it.kind==='secs'?mmss(EXTRAS_VAL[it.name]):EXTRAS_VAL[it.name]; const unit=it.kind==='reps'?'reps':(it.kind==='secs'?'':'min');
    ctrl='<div class="exstep"><div class="exval"><span id="exv_'+i+'">'+disp+'</span>'+(unit?' <span class="u">'+unit+'</span>':'')+'</div><div class="exbtns"><button onclick="event.stopPropagation();exBump('+i+',-'+it.step+')">–</button><button onclick="event.stopPropagation();exBump('+i+','+it.step+')">+</button></div></div>'; }
  const sub = it.target ? (dashCount(it.name)+' / '+it.target+' this week') : (done?'✓ done today':'tap to log');
  div.innerHTML='<div class="n">'+extraEmoji(it.name)+' '+it.name+' <span class="chk">✓</span></div><div class="p">'+sub+'</div>'+
    (it.target?'<div class="bar"><i style="width:'+Math.min(100,Math.round(100*dashCount(it.name)/it.target))+'%"></i></div>':'')+ctrl;
  div.onclick=function(){ if(disabled) return; toggleExtra(it,done,div); };
  return div;
}
function extraPayload(it,val){ if(it.kind==='reps') return {time:'',reps:val,notes:''}; if(it.kind==='timed'||it.kind==='secs') return {time:val,reps:'',notes:''}; return {time:'',reps:'',notes:''}; }
function exBump(i,delta){ const it=EXTRA_ITEMS[i]; EXTRAS_VAL[it.name]=Math.max(0,(EXTRAS_VAL[it.name]||0)+delta);
  const el=document.getElementById('exv_'+i); if(el) el.textContent=(it.kind==='secs')?mmss(EXTRAS_VAL[it.name]):EXTRAS_VAL[it.name];
  if(EXTRAS_DONE.indexOf(it.name)>=0) saveExtra(it,true); }
function saveExtra(it,silent){ const p=extraPayload(it,EXTRAS_VAL[it.name]);

  const note=document.getElementById('n'+i)?document.getElementById('n'+i).value:''; let entry;
  if(isPyr){ entry={user:CUR_USER,exercise:it.exercise,category:it.category,notes:note,day:CUR_DAY,logDate:CUR_DATE,loadType:LOAD_SEL[i]||it.loadType,progress:'',pyramid:d._pyr.map(s=>({w:+s.w||0,r:+s.r||0}))}; }
  else if(isCardio){ const cf=cardioFields(it.exercise); entry={user:CUR_USER,exercise:it.exercise,category:'Cardio',notes:note,day:CUR_DAY,logDate:CUR_DATE,sets:0,reps:0,weight:'',loadType:'',progress:'',time:cf.time?+val('t'+i):'',level:cf.level?+val('lv'+i):'',pace:cf.pace?val('pc'+i):'',calories:cf.cal?+val('cal'+i):''}; }
  else { entry={user:CUR_USER,exercise:it.exercise,sets:+val('s'+i),reps:+val('r'+i),weight:val('w'+i)===''?'':+val('w'+i),loadType:LOAD_SEL[i]||it.loadType,progress:d._prog,category:it.category,notes:note,day:CUR_DAY,logDate:CUR_DATE}; }
  google.script.run.withSuccessHandler(function(res){ btn.classList.remove('saving'); btn.textContent=res.updated?'✓ Updated':'✓ Logged'; d.classList.remove('invalid','done','flat','record');
    const st=cardStatus(it, isPyr?{pyr:entry.pyramid}:(isCardio?null:{sets:entry.sets,reps:entry.reps,weight:entry.weight}));
    d.classList.add(statusClass(st));
    it.existing=isPyr?{sets:entry.pyramid.length,reps:0,weight:'',progress:'',notes:note}:{sets:entry.sets,reps:entry.reps,weight:entry.weight,progress:d._prog,notes:note};
    if(isPyr) it.pyramidStart=entry.pyramid;
    toast(st==='flat'?(it.exercise+' saved · same as last time'):res.message, st==='pr'?'gold':(st==='flat'?'warn':'')); refreshDash();
  }).withFailureHandler(function(e){ btn.classList.remove('saving'); btn.textContent='Retry'; toast('Error: '+(e.message||e),'err'); }).logSet(entry); }
function refreshDash(){ google.script.run.withSuccessHandler(function(dash){ STATE.dashboard=dash; renderKpis(dash); renderExtras(); }).getDashboardPublic(CUR_USER); refreshWeek(); }
function refreshWeek(){ if(!WEEK) return; google.script.run.withSuccessHandler(function(w){ WEEK=w; renderWeek(); }).getWeek(CUR_USER,CUR_OFFSET,WEEK_MODE); }

/* ---------- Fine Arts ---------- */
function renderArts(data){ CUR_DATE=data.dateISO; document.getElementById('subhead').textContent=data.dateLabel;
  document.getElementById('artsTitle').innerHTML='🎨 Fine Arts<span class="meta">'+data.dateLabel+'</span>';
  const box=document.getElementById('artsCards'); box.innerHTML=''; data.activities.forEach((a,i)=>box.appendChild(artCard(a,i))); }
function artCard(a,i){ const emoji=ARTS_META[a.name]||'🎨'; const done=a.done;
  const mins=done&&a.minutes!==''?a.minutes:20; const rating=done?(Number(a.rating)||0):0; const note=done&&a.note?a.note:'';
  const d=document.createElement('div'); d.className='card'+(done?' done':''); d.id='art'+i; d._name=a.name; d._rating=rating;
  let stars=''; for(let n=1;n<=5;n++) stars+='<span class="star'+(n<=rating?' on':'')+'" data-n="'+n+'" onclick="setArtRating('+i+','+n+')">★</span>';
  d.innerHTML='<div class="crow"><div class="ex">'+emoji+' '+a.name+'</div><div class="tag" id="artstat'+i+'">'+(done?('✓ '+(a.minutes||0)+' min'):'not yet')+'</div></div>'+
    '<div class="steppers c1" style="margin-top:11px"><div class="st"><div class="lab">Minutes</div><input class="val" id="at'+i+'" type="number" inputmode="numeric" value="'+mins+'"><div class="unit">min</div><div class="ctrl"><button onclick="bump(\'at'+i+'\',-5)">–</button><button onclick="bump(\'at'+i+'\',5)">+</button></div></div></div>'+
    '<div class="slab" style="margin-top:12px">How did it go?</div><div class="stars" id="stars'+i+'">'+stars+'</div>'+
    '<input class="note" id="anote'+i+'" placeholder="What did you practice / read / watch?" value="'+(note?esc(note):'')+'">'+
    '<div class="actions"><button class="btn primary" id="artbtn'+i+'" onclick="logArt('+i+')">'+(done?'Update':'Log')+'</button>'+(done?'<button class="btn ghost" id="artundo'+i+'" onclick="undoArt('+i+')">Undo</button>':'')+'</div>';
  return d; }
function setArtRating(i,n){ const c=document.getElementById('art'+i); c._rating=n; const st=document.getElementById('stars'+i); [...st.children].forEach(s=>s.classList.toggle('on',+s.dataset.n<=n)); }
function logArt(i){ const c=document.getElementById('art'+i), name=c._name, mins=+val('at'+i), rating=c._rating||0, note=val('anote'+i);
  const btn=document.getElementById('artbtn'+i); btn.classList.add('saving'); btn.innerHTML='<span class="spinner"></span>';
  google.script.run.withSuccessHandler(function(){ btn.classList.remove('saving'); btn.textContent='✓ Saved'; c.classList.add('done'); document.getElementById('artstat'+i).textContent='✓ '+mins+' min'; toast(name+' · '+mins+' min'+(rating?(' · '+rating+'★'):'')); refreshWeek();
  }).withFailureHandler(function(){ btn.classList.remove('saving'); btn.textContent='Retry'; toast('Error','err'); }).setArts(CUR_USER,name,CUR_DAY,CUR_DATE,mins,rating,note,true); }
function undoArt(i){ const c=document.getElementById('art'+i), name=c._name;
  google.script.run.withSuccessHandler(function(){ toast(name+' unlogged'); loadArts(); refreshWeek(); }).setArts(CUR_USER,name,CUR_DAY,CUR_DATE,0,0,'',false); }
function loadArts(){ document.getElementById('artsCards').innerHTML='<div class="center"><span class="spinner"></span> Loading…</div>'; google.script.run.withSuccessHandler(renderArts).getArtsDay(CUR_USER,CUR_DATE); }

/* ---------- progress ---------- */
function setProgMode(m){ PROG_MODE=m; document.getElementById('pmw').classList.toggle('sel',m==='workout'); document.getElementById('pme').classList.toggle('sel',m==='extras'); document.getElementById('pma').classList.toggle('sel',m==='arts'); loadProgress(); }
function loadProgress(){ document.getElementById('chartDayVol').style.display='none';
  if(PROG_MODE==='workout') loadDayProgress(CUR_DAY); else if(PROG_MODE==='extras') loadExtrasProgress(); else loadArtsProgress(); }
function loadDayProgress(day){ const tt=DAY_I18N[day]; document.getElementById('progTitle').textContent=day+' · '+tt.jp+' · '+tt.kr+' — progress';
  document.getElementById('progHelp').textContent='Pick a lift to see your top weight over time. "Volume" = total lb moved (sets × reps × weight).';
  document.getElementById('progEx').innerHTML=''; document.getElementById('prStat').innerHTML='<span class="spinner"></span> loading…';
  google.script.run.withSuccessHandler(function(dp){
    const box=document.getElementById('progEx'); box.innerHTML=''; dp.exercises.forEach((ex,idx)=>{ const c=document.createElement('span'); c.className='chip'+(idx===0?' sel':''); c.textContent=ex; c.onclick=function(){ [...box.children].forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); loadHistory(ex); }; box.appendChild(c); });
    if(dp.exercises.length) loadHistory(dp.exercises[0]); else document.getElementById('prStat').textContent='No logs for '+day+' yet.';
  }).getDayProgress(CUR_USER,day); }
function loadHistory(ex){ document.getElementById('prStat').innerHTML='<span class="spinner"></span> loading…'; google.script.run.withSuccessHandler(drawHistory).getHistory(CUR_USER,ex); }
function drawHistory(h){ const labels=h.points.map(p=>p.date);
  if(h.cardio){ document.getElementById('prStat').innerHTML='<b style="color:#c7d2fe">'+h.exercise+'</b> — max '+h.maxTime+' min · '+h.maxCal+' cal · '+h.points.length+' logs';
    cW=chart('chartWeight',cW,labels,h.points.map(p=>p.time),'Time (min)','#3b82f6','line'); cV=chart('chartVolume',cV,labels,h.points.map(p=>p.calories),'Calories','#10b981','bar');
  } else { document.getElementById('prStat').innerHTML='<b style="color:#c7d2fe">'+h.exercise+'</b> — top weight '+h.maxWeight+' lb · '+h.points.length+' logs';
    cW=chart('chartWeight',cW,labels,h.points.map(p=>p.weight),'Top weight (lb)','#3b82f6','line'); cV=chart('chartVolume',cV,labels,h.points.map(p=>p.volume),'Total lb (sets×reps×wt)','#10b981','line'); } }
function loadExtrasProgress(){ document.getElementById('progTitle').textContent='Other Exercises — progress'; document.getElementById('progHelp').textContent='Pick an item to see reps/laps and time over time.';
  const box=document.getElementById('progEx'); box.innerHTML=''; document.getElementById('prStat').innerHTML='';
  const list=EXTRA_ITEMS.filter(it=>it.kind!=='toggle');
  list.forEach((it,idx)=>{ const c=document.createElement('span'); c.className='chip'+(idx===0?' sel':''); c.textContent=extraEmoji(it.name)+' '+it.name; c.onclick=function(){ [...box.children].forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); loadExtraHistory(it); }; box.appendChild(c); });
  if(list.length) loadExtraHistory(list[0]); }
function loadExtraHistory(it){ document.getElementById('prStat').innerHTML='<span class="spinner"></span> loading…';
  google.script.run.withSuccessHandler(function(h){ const labels=h.points.map(p=>p.date); const isReps=(it.kind==='reps'||it.kind==='swim');
    const primary=h.points.map(p=> isReps? p.reps : p.time); const plabel=it.kind==='reps'?'Reps':(it.kind==='swim'?'Laps':(it.kind==='secs'?'Seconds':'Minutes'));
    document.getElementById('prStat').innerHTML='<b style="color:#c7d2fe">'+extraEmoji(it.name)+' '+it.name+'</b> — '+h.points.length+' logs';
    cW=chart('chartWeight',cW,labels,primary,plabel,'#3b82f6','line'); cV=chart('chartVolume',cV,labels,h.points.map(p=>p.time),'Time (min/sec)','#10b981','line');
  }).getHistory(CUR_USER,it.name); }
function loadArtsProgress(){ document.getElementById('progTitle').textContent='Fine Arts — progress'; document.getElementById('progHelp').textContent='Pick an activity to see practice time and how it went (rating) over time.';
  const box=document.getElementById('progEx'); box.innerHTML=''; document.getElementById('prStat').innerHTML='';
  ARTS_LIST.forEach((a,idx)=>{ const c=document.createElement('span'); c.className='chip'+(idx===0?' sel':''); c.textContent=ARTS_META[a]+' '+a; c.onclick=function(){ [...box.children].forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); loadArtsHistory(a); }; box.appendChild(c); });
  loadArtsHistory(ARTS_LIST[0]); }
function loadArtsHistory(a){ document.getElementById('prStat').innerHTML='<span class="spinner"></span> loading…';
  google.script.run.withSuccessHandler(function(h){ document.getElementById('prStat').innerHTML='<b style="color:#c7d2fe">'+a+'</b> — '+fmtMin(h.totalMin)+' total · '+h.sessions+' sessions · avg '+h.avgRating+'★';
    const labels=h.points.map(p=>p.date); cW=chart('chartWeight',cW,labels,h.points.map(p=>p.minutes),'Minutes','#3b82f6','line'); cV=chart('chartVolume',cV,labels,h.points.map(p=>p.rating),'Rating (1-5)','#f5b301','line');
  }).getArtsProgress(CUR_USER,a); }
function chart(id,inst,labels,data,label,color,type){ if(inst)inst.destroy();
  return new Chart(document.getElementById(id),{type:type,data:{labels:labels,datasets:[{label:label,data:data,borderColor:color,backgroundColor:color+'33',tension:.3,fill:true,pointRadius:3,borderWidth:2}]},
    options:{plugins:{legend:{labels:{color:'#93a1c0'}}},scales:{x:{ticks:{color:'#93a1c0'},grid:{color:'#26324c'}},y:{ticks:{color:'#93a1c0'},grid:{color:'#26324c'}}}}}); }

/* ---------- nav + utils ---------- */
function show(v){ TAB=v;
  ['workout','arts','progress'].forEach(x=>{ document.getElementById('view-'+x).classList.toggle('active',x===v); document.getElementById('nav-'+x).classList.toggle('active',x===v); });
  document.getElementById('dateBar').style.display=(v==='progress')?'none':'block';
  if(v==='workout') reloadWeek('workout'); else if(v==='arts') reloadWeek('arts'); else loadProgress();
  const wrapEl=document.querySelector('.wrap'); if(wrapEl) wrapEl.scrollTo(0,0); window.scrollTo(0,0); moveNavLens(); }
/* ---------- Liquid Glass tab bar: tap or drag the lens between tabs ---------- */
function navTabs(){ return ['workout','arts','progress'].map(v=>document.getElementById('nav-'+v)).filter(a=>a && a.style.display!=='none'); }
function placeLens(x,w){ const l=document.getElementById('navlens'); if(!l) return; l.style.width=w+'px'; l.style.transform='translateX('+x+'px)'; }
function moveNavLens(){ const a=document.querySelector('#tabbar a.active'); if(a) placeLens(a.offsetLeft,a.offsetWidth); }
(function(){ const bar=document.getElementById('tabbar'), lens=document.getElementById('navlens'); if(!bar) return;
  let drag=null, suppress=false;
  bar.addEventListener('pointerdown',function(e){ const a=document.querySelector('#tabbar a.active'); if(!a) return;
    drag={x0:e.clientX, startX:a.offsetLeft, w:a.offsetWidth, moved:false}; });
  bar.addEventListener('pointermove',function(e){ if(!drag) return; const dx=e.clientX-drag.x0;
    if(!drag.moved && Math.abs(dx)<6) return;
    if(!drag.moved){ drag.moved=true; lens.classList.add('drag'); try{ bar.setPointerCapture(e.pointerId); }catch(_){} }
    const tabs=navTabs(), min=tabs[0].offsetLeft, max=tabs[tabs.length-1].offsetLeft;
    placeLens(Math.max(min-6,Math.min(max+6,drag.startX+dx)),drag.w);
    const c=drag.startX+dx+drag.w/2; tabs.forEach(t=>t.classList.toggle('hover',Math.abs(t.offsetLeft+t.offsetWidth/2-c)<t.offsetWidth/2)); });
  function end(e){ if(!drag) return; const d=drag; drag=null; lens.classList.remove('drag');
    if(!d.moved){ return; }
    suppress=true; setTimeout(()=>suppress=false,0);
    const m=new DOMMatrix(getComputedStyle(lens).transform), c=m.m41+d.w/2;
    let best=null,bd=1e9; navTabs().forEach(t=>{ const dd=Math.abs(t.offsetLeft+t.offsetWidth/2-c); if(dd<bd){bd=dd;best=t;} });
    const v=best?best.id.replace('nav-',''):TAB; if(v!==TAB) show(v); else moveNavLens(); }
  bar.addEventListener('pointerup',end); bar.addEventListener('pointercancel',end);
  bar.addEventListener('click',function(e){ if(suppress){ e.stopPropagation(); e.preventDefault(); } },true);
  window.addEventListener('resize',moveNavLens);
  requestAnimationFrame(moveNavLens);
})();
function bump(id,step){ const el=document.getElementById(id); el.value=round(Math.max(0,(+el.value||0)+step)); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function val(id){ return document.getElementById(id).value; }
function round(n){ return Math.round(n*100)/100; }
function toast(m,cls){ const t=document.getElementById('toast'); t.textContent=m; t.className='show'+(cls?(' '+cls):''); clearTimeout(tT); tT=setTimeout(()=>t.className='',2200); }
</script>
